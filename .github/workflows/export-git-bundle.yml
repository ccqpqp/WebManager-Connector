name: Export full Git history
on:
  push:
    branches:
      - migration/export-20261107
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout all history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create and verify repository bundle
        shell: bash
        run: |
          git bundle create "$RUNNER_TEMP/repository.bundle" --all
          git bundle verify "$RUNNER_TEMP/repository.bundle"
          sha256sum "$RUNNER_TEMP/repository.bundle" > "$RUNNER_TEMP/repository.bundle.sha256"
      - name: Upload the full history
        uses: actions/upload-artifact@v4
        with:
          name: repository-bundle
          path: |
            ${{ runner.temp }}/repository.bundle
            ${{ runner.temp }}/repository.bundle.sha256
          compression-level: 0
          retention-days: 7
